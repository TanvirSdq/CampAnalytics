<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ PAGE_TITLE }} — Wikimedia Commons Campaign Suite</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23183f54'/><circle cx='16' cy='16' r='9' stroke='%2372ded6' stroke-width='1.8' fill='none'/><ellipse cx='16' cy='16' rx='4.5' ry='9' stroke='%2372ded6' stroke-width='1.4' fill='none'/><line x1='7' y1='16' x2='25' y2='16' stroke='%2372ded6' stroke-width='1.4'/><circle cx='20.5' cy='11.5' r='2' fill='%23ffffff'/><circle cx='11.5' cy='20.5' r='1.5' fill='%2372ded6'/></svg>">
    <style>
        {{ CUSTOM_CSS | safe }}
    </style>
</head>
<body>
    <!-- Top Navigation Bar (GLAMtools Style) -->
    <header class="top-navbar">
        <div class="navbar-container">
            <div class="navbar-left">
                <a href="/" class="navbar-brand" title="CampAnalytics Home">
                    <span class="brand-bold">Camp</span><span class="brand-accent">Analytics</span>
                </a>
                <nav>
                    <ul class="nav-tabs">
                        <li class="nav-tab-item">
                            <a href="/retention" class="nav-tab-link {% if mode == 'Retention Analytics' or request.path == '/retention' %}active{% endif %}">Retention Analytics</a>
                        </li>
                        <li class="nav-tab-item">
                            <a href="/health" class="nav-tab-link {% if mode == 'Health Evaluation' or request.path == '/health' %}active{% endif %}">Health Evaluation</a>
                        </li>
                        <li class="nav-tab-item">
                            <a href="/?mode=Methodology" class="nav-tab-link {% if mode in ('Methodology', 'Methodology & Usage') or request.path == '/methodology' or (request.path == '/' and (not request.args.get('mode') or request.args.get('mode') in ('Methodology', 'Methodology & Usage'))) %}active{% endif %}">Methodology</a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="navbar-right">
                <a href="https://github.com/siddiquetanvir/WebApp" class="nav-util-link" target="_blank" rel="noopener noreferrer" title="View Source on GitHub">
                    <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    <span>GitHub</span>
                </a>
                <a href="https://meta.wikimedia.org/wiki/Project_Korikath" class="nav-korikath-link" target="_blank" rel="noopener noreferrer" title="Project Korikath — Wikimedia Community Initiative">
                    <img src="{{ KORIKATH_LOGO_URL }}" alt="Project Korikath Logo" class="korikath-navbar-logo">
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Wikimedia Toolforge Compact Footer -->
    <footer class="toolforge-footer">
        <div class="toolforge-footer-content">
            <div>
                Hosted on <a href="https://toolforge.org" target="_blank" rel="noopener noreferrer">Wikimedia Toolforge</a> ·
                Released under the <a href="https://www.gnu.org/licenses/gpl-2.0.html" target="_blank" rel="noopener noreferrer">GNU General Public License v2.0 or later (GPL-2.0+)</a>
            </div>
            <div class="toolforge-footer-links">
                <a href="https://github.com/siddiquetanvir/WebApp" target="_blank" rel="noopener noreferrer">Source Repository</a>
                <span>·</span>
                <a href="/?mode=Methodology">Methodology &amp; Usage Guide</a>
                <span>·</span>
                <a href="https://commons.wikimedia.org" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>
            </div>
        </div>
    </footer>
</body>
</html>
