<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ PAGE_TITLE }}</title>
    <style>
        {{ CUSTOM_CSS | safe }}
        /* Additional baseline CSS for Flask layout mimicking Streamlit sidebar */
        body { margin: 0; font-family: "Inter", sans-serif; display: flex; min-height: 100vh; background-color: #0a1526; color: #eef3fc; }
        .sidebar { width: 300px; background-color: #13284a; padding: 20px; box-sizing: border-box; flex-shrink: 0; }
        .main-content { flex-grow: 1; padding: 40px; box-sizing: border-box; overflow-y: auto; }
        .sidebar img { display: block; margin: 0 auto 20px; }
        .sidebar form { display: flex; flex-direction: column; gap: 15px; }
        .sidebar label { font-weight: bold; font-size: 0.9em; }
        .sidebar input, .sidebar select, .sidebar textarea { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; margin-top: 5px; box-sizing: border-box; }
        .sidebar button { background-color: #3366cc; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .sidebar button:hover { background-color: #14428e; }
        .radio-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
        .radio-group label { font-weight: normal; }
        .radio-group input { width: auto; margin-right: 8px; }
        .divider { border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0; }
        a.nav-link { color: white; text-decoration: none; padding: 10px; display: block; border-radius: 4px; }
        a.nav-link.active { background-color: rgba(255,255,255,0.1); }
        
        body { 
            margin: 0; 
            font-family: "Inter", sans-serif; 
            background-color: var(--bg-deep, #0a1526); 
            color: var(--text-light, #eef3fc); 
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .header {
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header img {
            width: 120px;
            height: auto;
        }
        .header-text h1 {
            margin: 0 0 5px 0;
            font-size: 2.2em;
        }
        .header-text p.tagline {
            color: {{ TEXT_MUTED }};
            font-size: 1.05em;
            margin: 0;
        }
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .nav-link {
            color: var(--text-light, #eef3fc);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            background-color: rgba(255,255,255,0.05);
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .nav-link.active {
            background-color: #3366cc;
            color: white;
        }
        .nav-link:hover:not(.active) {
            background-color: rgba(255,255,255,0.1);
        }
        
        /* Card styling */
        .card { 
            background: rgba(255,255,255,0.05); 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); 
            margin-bottom: 25px;
            overflow: hidden;
        }
        .card-header {
            background-color: rgba(0,0,0,0.25);
            padding: 15px 20px;
            font-weight: bold;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 1.1em;
        }
        .card-body {
            padding: 20px;
        }
        
        /* Form elements */
        label { font-weight: bold; font-size: 0.9em; display: block; margin-bottom: 5px; color: #a9b9d8; }
        input[type="text"], input[type="number"], select, textarea { 
            width: 100%; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0,0,0,0.2); 
            color: white; 
            box-sizing: border-box; 
            font-family: inherit;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3366cc;
        }
        
        button.btn-primary { 
            background-color: #3366cc; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        button.btn-primary:hover { background-color: #14428e; }
        
        button.btn-secondary {
            background-color: rgba(255,255,255,0.1);
            color: white; 
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
        }
        button.btn-secondary:hover { background-color: rgba(255,255,255,0.2); }
        
        .radio-group { display: flex; gap: 20px; flex-wrap: wrap; }
        .radio-group label { font-weight: normal; display: inline-flex; align-items: center; gap: 8px; color: inherit; margin: 0; }
        .radio-group input { width: auto; }
        
        .alert-error { padding: 15px; border-radius: 4px; margin-bottom: 20px; background-color: rgba(255,0,0,0.1); border: 1px solid rgba(255,0,0,0.3); color: #ffcccc; }
        .alert-info { padding: 15px; border-radius: 4px; margin-bottom: 20px; background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #a9b9d8; }
        
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        
        table.data-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table.data-table th, table.data-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        table.data-table th { background-color: rgba(255,255,255,0.05); }
        table.data-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.9em; }
        table.data-table th, table.data-table td { padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        table.data-table th { background-color: rgba(255,255,255,0.05); font-weight: bold; color: #a9b9d8; }
        table.data-table tr:hover { background-color: rgba(255,255,255,0.02); }

        .form-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .form-col { flex: 1; }
        
        .form-group { margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div style="text-align: center; margin-bottom: 20px;">
            <img src="{{ KORIKATH_LOGO_URL }}" alt="Project Korikath Logo" style="width: 140px; height: auto;">
    <div class="container">
        <div class="header">
            <img src="{{ KORIKATH_LOGO_URL }}" alt="Project Korikath Logo">
            <div class="header-text">
                <h1>{{ PAGE_TITLE }}</h1>
                <p class="tagline">Integrated Analytics Platform Engine for Wikimedia Commons.</p>
            </div>
        </div>
        
        <h2>App Mode</h2>
        <div class="radio-group" style="margin-bottom: 20px;">
        <div class="nav-tabs">
            <a href="{{ url_for('index', mode='Retention Analytics') }}" class="nav-link {% if mode == 'Retention Analytics' %}active{% endif %}">Retention Analytics</a>
            <a href="{{ url_for('index', mode='Health Evaluation') }}" class="nav-link {% if mode == 'Health Evaluation' %}active{% endif %}">Health Evaluation</a>
            <a href="{{ url_for('index', mode='Methodology') }}" class="nav-link {% if mode == 'Methodology' %}active{% endif %}">Methodology</a>
        </div>

        <div class="divider"></div>

        {% block sidebar %}{% endblock %}

        <div class="divider"></div>
        <div style="font-size: 0.8em; color: {{ TEXT_MUTED }}; text-align: center;">Integrated Analytics Platform Engine</div>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
